# One small always-on machine: the map, live ships and buoys.
app = "night-atlas"
primary_region = "yyz"

[env]
  # Old addresses that should forward to the current one (remove if you deploy your own copy).
  REDIRECTS = "atlas.briandonohue.ca=harbour.briandonohue.ca"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # the AIS connection must stay open
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
