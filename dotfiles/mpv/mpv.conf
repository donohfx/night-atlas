# mpv + uosc (2026-11-24). uosc replaces the built-in OSC/OSD bar.
osc=no
osd-bar=no
# uosc draws its own top bar
border=no
# don't close at end of file
keep-open=yes
save-position-on-quit=yes
hwdec=auto-safe
vo=gpu-next
osd-font="Iosevka Aile"
sub-font="Iosevka Aile"
sub-auto=fuzzy
screenshot-directory=~/Pictures/Screenshots
# remember position/tracks/volume on quit, but not playback speed
watch-later-options-remove=speed
